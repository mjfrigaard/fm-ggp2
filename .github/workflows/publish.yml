# Publishes the book to GitHub Pages on every push to main.
# R is not installed here: execute: freeze: auto means chapters are rendered
# locally and their results committed in _freeze/, which this job reuses.
# The rendered _book/ is uploaded as a Pages artifact (no gh-pages branch).
on:
  push:
    branches: main
    paths-ignore:
      - "_drafts/**"
      - "README.md"
  workflow_dispatch:

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
